name: Refresh photo metadata
on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'tools/build_photo_metadata.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ExifTool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - name: Build metadata catalog
        run: python3 tools/build_photo_metadata.py
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo_metadata.json
          git diff --cached --quiet || git commit -m "Refresh photo metadata catalog"
          git push
