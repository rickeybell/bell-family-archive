name: Deploy Bell Family Archive to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build lightweight Pages site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          # Public website pages and lightweight support files.
          find . -maxdepth 1 -type f \( \
              -name '*.html' -o \
              -name '*.css' -o \
              -name '*.js' -o \
              -name '*.json' -o \
              -name '*.ico' -o \
              -name '*.webmanifest' -o \
              -name '.nojekyll' \
            \) -exec cp -p {} _site/ \;

          # Thumbnails and tiny audio files remain in the Pages artifact.
          # Full photo views, high-resolution downloads, and browser-safe videos
          # are served from Cloudflare R2 to keep the Git repository and Pages
          # deployment lightweight.
          if [ -d thumbs ]; then
            cp -a thumbs _site/thumbs
          fi

          if [ -d audio ]; then
            cp -a audio _site/audio
          fi

          # Small fixed portraits used by the family tree and family-member cards.
          if [ -d tree_portraits ]; then
            cp -a tree_portraits _site/tree_portraits
          fi

          if [ -d tree_thumbs ]; then
            cp -a tree_thumbs _site/tree_thumbs
          fi

          # Rewrite full photo views, downloads, and video links so deployed
          # pages fetch them directly from the GitHub repository.
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          from urllib.parse import quote, unquote

          root = Path("_site")
          media_base = "https://bell-family-media.rbell.workers.dev/"

          def media_url(path):
              path = unquote(path.replace("\\\\", "/").replace("\\", "/"))
              encoded = "/".join(quote(part, safe="") for part in path.split("/"))
              return media_base + encoded

          for page in root.glob("*.html"):
              text = page.read_text(encoding="utf-8")

              def repl_repo_media(match):
                  quote_char = match.group(1)
                  return quote_char + media_url(match.group(2)) + quote_char

              # Covers ordinary src/href values plus the inline gallery JSON.
              text = re.sub(
                  r'(["\'])((?:highres|images|videos)/[^"\']+)\1',
                  repl_repo_media,
                  text,
                  flags=re.IGNORECASE
              )
              page.write_text(text, encoding="utf-8")

          metadata_path = root / "photo_metadata.json"
          if metadata_path.is_file():
              records = json.loads(metadata_path.read_text(encoding="utf-8-sig"))
              for record in records:
                  path = str(record.get("path", ""))
                  if path.lower().startswith(("images/", "videos/")):
                      record["path"] = media_url(path)
              metadata_path.write_text(
                  json.dumps(records, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8"
              )
          PY

          echo
          echo "Pages package:"
          du -sh _site
          echo
          echo "Largest top-level items:"
          du -sh _site/* 2>/dev/null | sort -h | tail -20

          # Safety stop well below GitHub Pages' 1 GB artifact ceiling.
          SIZE_BYTES=$(du -sb _site | cut -f1)
          LIMIT_BYTES=$((900 * 1024 * 1024))
          if [ "$SIZE_BYTES" -ge "$LIMIT_BYTES" ]; then
            echo "ERROR: Pages package is 900 MB or larger."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
