name: Repair people page layout
on:
  push:
    branches: [main]
    paths:
      - 'tools/refresh_person_page_links.py'
      - '.github/workflows/people-layout-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: people-layout-main
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite people pages
        run: python3 tools/refresh_person_page_links.py
      - name: Commit repaired pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dickey.html spooky.html buster.html alma.html rickey.html sonja.html heather.html stephanie.html jarred.html
          if git diff --cached --quiet; then
            echo "No people-page layout changes needed."
            exit 0
          fi
          git commit -m "Repair people page full-width layout"
          git pull --rebase origin main
          git push origin HEAD:main
